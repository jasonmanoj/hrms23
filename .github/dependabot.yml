version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['@prisma/*', 'prisma']
    commit-message:
      prefix: 'chore(backend)'

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ['next', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    commit-message:
      prefix: 'chore(frontend)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
