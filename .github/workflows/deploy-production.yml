name: Deploy to Production

# Fires once CI has finished on `main`. The actual deploy step only runs after a human
# approves it via the `production` GitHub Environment (Settings → Environments →
# production → Required reviewers) — this is the manual approval gate.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger Railway production deploy
        run: |
          curl -sS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}" \
            --fail --retry 3 --retry-delay 5
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}

      - name: Trigger Vercel production deploy
        run: |
          curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            --fail --retry 3 --retry-delay 5
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Record deployment
        run: |
          echo "### Deployed to production :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: ${{ github.event.workflow_run.actor.login }}" >> "$GITHUB_STEP_SUMMARY"
